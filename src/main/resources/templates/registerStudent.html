<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark px-5 border-bottom">
		  <div class="container-fluid">
		    <a class="navbar-brand" href="/" >Student Management System</a>
		    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
		      <span class="navbar-toggler-icon"></span>
		    </button>
		    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
		      <div class="navbar-nav">
		        <a class="nav-link active" aria-current="page" href="/">Home</a>
		      </div>
		    </div>
		      <div class="border">
		        <a class="nav-link " aria-current="page" href="/registerStd">Register Student</a>
		      </div>
		  </div>
		</nav>
	</header>
	<h1 class="text-center">REgister std</h1>
	<!--  <img src="./images/back.png" class="img-fluid" alt="...">-->
	<div class="container">
		<form th:action="@{/registerStdFormSubmit}" method="post">
		  <div class="mb-3">
		    <label for="name" class="form-label">Name</label>
		    <input type="text" class="form-control" id="name" name="name" required>
		  </div>
		  <div class="mb-3">
		    <label for="exampleInputEmail1" class="form-label">Email</label>
		    <input type="email" class="form-control" id="exampleInputEmail1" name="email" required>
		  </div>
		  <div class="mb-3">
		    <label for="phone" class="form-label">Phone</label>
		    <input type="number" class="form-control" id="phone" name="phone" required>
		  </div>
		  <button type="submit" class="btn btn-primary">Add Student</button>
		</form>
	</div>
	
	
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
